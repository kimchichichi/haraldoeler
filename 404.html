<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, follow" />
  <meta name="description" content="Seite nicht gefunden — Harald Oeler." />
  <title>HARALD OELER — Seite nicht gefunden</title>
  <link rel="stylesheet" href="/assets/fonts.css?v=1">
  <link rel="icon" href="/image/favicon.ico" type="image/x-icon">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="stylesheet" href="/assets/site.css?v=12">
  <style>
:root {
  --ink: #0e0d0c;
  --paper: #f4f1ec;
  --muted: #6b655c;
  --accent: #6b1d1a;
  --serif: 'Cormorant Garamond', 'Times New Roman', serif;
  --sans: Avenir, 'Avenir Next', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  background: var(--paper);
  color: var(--ink);
  font-family: var(--sans);
  min-height: 100vh;
}
a { color: inherit; text-decoration: none; }
.site-header {
  border-bottom: 1px solid color-mix(in srgb, var(--ink) 12%, transparent);
}
.header-inner {
  max-width: 1480px;
  margin: 0 auto;
  padding: 22px 48px;
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 24px;
}
.wordmark {
  font-size: 13px;
  letter-spacing: 0.32em;
  text-transform: uppercase;
  font-weight: 500;
}
.wordmark .dot {
  display: inline-block;
  width: 5px; height: 5px;
  border-radius: 50%;
  background: var(--accent);
  margin: 0 10px 2px;
  vertical-align: middle;
}
.wordmark small {
  font-family: var(--serif);
  font-style: italic;
  font-weight: 400;
  font-size: 13px;
  letter-spacing: 0.04em;
  text-transform: none;
  color: var(--muted);
}
nav.primary { display: flex; gap: 28px; font-size: 12px; letter-spacing: 0.18em; text-transform: lowercase; }
nav.primary a { color: var(--muted); }
nav.primary a:hover { color: var(--ink); }
.wrap {
  max-width: 720px;
  margin: 0 auto;
  padding: 120px 48px 160px;
}
.eyebrow {
  font-size: 11px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 18px;
}
h1 {
  font-family: var(--serif);
  font-weight: 400;
  font-size: clamp(42px, 8vw, 72px);
  line-height: 1.05;
  margin-bottom: 24px;
}
h1 em { font-style: italic; color: var(--accent); }
.lead {
  font-size: 16px;
  line-height: 1.6;
  color: color-mix(in srgb, var(--ink) 78%, transparent);
  margin-bottom: 40px;
  max-width: 42ch;
}
.links {
  display: flex;
  flex-wrap: wrap;
  gap: 12px 28px;
  font-size: 12px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
}
.links a {
  border-bottom: 1px solid color-mix(in srgb, var(--accent) 35%, transparent);
  color: var(--accent);
  padding-bottom: 2px;
}
.links a:hover { border-bottom-color: var(--accent); }
@media (max-width: 720px) {
  .header-inner { padding: 18px 24px; }
  nav.primary { display: none; }
  .wrap { padding: 80px 24px 120px; }
}
  </style>
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="wordmark" href="/">
        HARALD<span class="dot"></span>OELER
        <small>accordionist &amp; composer</small>
      </a>
      <nav class="primary" aria-label="Hauptnavigation">
        <a href="/bio">bio</a>
        <a href="/projekte">projekte</a>
        <a href="/termine">termine</a>
        <a href="/news">news</a>
        <a href="/unterricht">unterricht</a>
        <a href="/medien">medien</a>
        <a href="/kontakt">kontakt</a>
      </nav>
    </div>
  </header>

  <main class="wrap" id="main">
    <p class="eyebrow">Fehler 404</p>
    <h1>Seite nicht <em>gefunden</em></h1>
    <p class="lead">
      Die angeforderte Adresse existiert nicht oder wurde verschoben.
      Nutzen Sie die Navigation oder einen der direkten Links.
    </p>
    <div class="links">
      <a href="/">Start</a>
      <a href="/termine">Termine</a>
      <a href="/news">News</a>
      <a href="/projekte">Projekte</a>
      <a href="/kontakt">Kontakt</a>
    </div>
  </main>
</body>
</html>
