[build]
     publish = "."

# Cache notes:
# Live site is on GitHub Pages, which forces Cache-Control: max-age=600 on all
# assets (PSI "efficient cache lifetimes"). These [[headers]] apply only when
# deploying to Netlify/Cloudflare Pages — not on raw GitHub Pages.
# Fix options: (1) deploy via Netlify, (2) put Cloudflare proxy in front and
# set Browser Cache TTL / Cache Rules for /assets/* /news/image/* /image/*.

[[headers]]
  for = "/image/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/projekte/image/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/projekte/image/page/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    # Versioned via ?v= in HTML; safe for long cache when deploying to Netlify/CF Pages.
    # GitHub Pages ignores these headers (forces max-age=600).
    Cache-Control = "public, max-age=31536000, immutable"

# Bundles are cache-busted via a ?v= query string in the HTML, so they can
# be cached long-term. Remember to bump ?v= whenever a bundle is rebuilt.
# Rebuild: npm run rebuild:projekte  (requires Node + esbuild).
[[headers]]
  for = "/assets/*.bundle.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

[[headers]]
  for = "/news/image/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/news/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

